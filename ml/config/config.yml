paths:
  model_path: models/best_model.pth
  plot_path: plots/architecture_comparison.png

data:
  data_dir: data
  batch_size: 32

experiment:
  seeds: [42, 1337, 2026]
  epochs: 30

trainer:
  patience: 6
  min_delta: 0.0001
  scheduler_patience: 3
  scheduler_factor: 0.5

search_space:
  - channels: [32, 64]
    hidden_size: 128
    dropout: 0.10
    lr: 0.0010
    weight_decay: 0.0001
  - channels: [32, 64, 128]
    hidden_size: 128
    dropout: 0.10
    lr: 0.0010
    weight_decay: 0.0001
  - channels: [32, 64, 128, 256]
    hidden_size: 128
    dropout: 0.15
    lr: 0.0008
    weight_decay: 0.0001
  - channels: [16, 32, 64, 128]
    hidden_size: 128
    dropout: 0.10
    lr: 0.0010
    weight_decay: 0.00005
  - channels: [32, 64, 128]
    hidden_size: 256
    dropout: 0.20
    lr: 0.0008
    weight_decay: 0.0005
  - channels: [32, 64, 128]
    hidden_size: 128
    dropout: 0.00
    lr: 0.0010
    weight_decay: 0.0001
